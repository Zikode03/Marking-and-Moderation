name: marking-and-moderation
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: marking-moderation-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:14332:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  dbmigrator:
    profiles: ["tools"]
    build:
      context: .local/backend
      dockerfile: Dockerfile
      target: dbmigrator
    environment:
      ConnectionStrings__Default: Server=sqlserver,1433;Database=ProsperaAssess;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Bootstrap__Email: ${BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD}
      Bootstrap__SchoolId: ${BOOTSTRAP_SCHOOL_ID}
    depends_on:
      sqlserver:
        condition: service_healthy
  api:
    build:
      context: .local/backend
      dockerfile: Dockerfile
    container_name: marking-moderation-api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      AllowedHosts: "*"
      AI__ServiceUrl: http://ai:8000/
      SalesMail__Host: ${SALES_SMTP_HOST:-}
      SalesMail__Port: ${SALES_SMTP_PORT:-587}
      SalesMail__From: ${SALES_SMTP_FROM:-}
      SalesMail__Username: ${SALES_SMTP_USERNAME:-}
      SalesMail__Password: ${SALES_SMTP_PASSWORD:-}
      Database__Initialize: "true"
      ConnectionStrings__Default: Server=sqlserver,1433;Database=ProsperaAssess;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Bootstrap__Email: ${BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD}
      Bootstrap__SchoolId: ${BOOTSTRAP_SCHOOL_ID}
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - api-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      ai:
        condition: service_started
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: marking-moderation-ai
    environment:
      PROSPERA_MODEL_DIR: /models
      PROSPERA_MODEL_MODULE: ${PROSPERA_MODEL_MODULE:-}
    volumes:
      - ${PROSPERA_MODEL_PATH:-./.local/training/deployed}:/models:ro
    restart: unless-stopped
  frontend:
    build: .
    container_name: marking-moderation-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  sql-data:
  api-keys:
  ai-models:
